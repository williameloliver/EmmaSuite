apply plugin: 'com.android.application'

android {
    compileSdkVersion 25
    buildToolsVersion "25.0.3"

    defaultConfig {
        applicationId "com.william.emmaboard"
        minSdkVersion 7
        targetSdkVersion 7
        versionCode 5
        versionName "0.3"
    }

    signingConfigs {
        legacy {
            storeFile file("legacy-debug.keystore")
            storePassword "emma1234"
            keyAlias "emma"
            keyPassword "emma1234"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.legacy
            minifyEnabled false
        }
    }
}
